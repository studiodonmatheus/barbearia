<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Don Matheus | Barbearia</title>
    <link rel="stylesheet" href="styles/reset.css">
    <link rel="stylesheet" href="styles/style.css">
</head>

<body>
    <header>
        <h1>Don Matheus</h1>
        <button class="nav-buttons" id="login-button" type="button" aria-label="Entrar" title="Entrar">
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21a8 8 0 0 0-16 0"></path>
                <circle cx="12" cy="8" r="4"></circle>
            </svg>
        </button>
    </header>
    
    <main>
        <section class="left-side" aria-labelledby="location-title">
            <div class="location-content">
                <p class="location-eyebrow">Visita presencial</p>
                <h2 id="location-title">Studio Don Matheus</h2>
                <p class="location-description">Quer ir até o local? Consulte o mapa ou trace sua rota.</p>
                <a class="location-directions" href="https://www.google.com/maps/dir/?api=1&destination=-23.686357444769772%2C-46.65049064662398" target="_blank" rel="noopener noreferrer">
                    Como chegar
                    <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14 3h7v7"></path>
                        <path d="M10 14 21 3"></path>
                        <path d="M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5"></path>
                    </svg>
                </a>
                <details class="map-disclosure">
                    <summary class="map-summary">
                        <span>Ver mapa</span>
                        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="m6 9 6 6 6-6"></path>
                        </svg>
                    </summary>
                    <div class="map-frame">
                        <iframe id="mapa" title="Localização do Studio Don Matheus" src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d228.35682120431682!2d-46.65049064662398!3d-23.686357444769772!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x94ce45005d05c281%3A0xdeb1876a6dcaff3d!2sStudio%20Don%20Matheus!5e0!3m2!1spt-BR!2sbr!4v1787503799568!5m2!1spt-BR!2sbr" allowfullscreen loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
                    </div>
                </details>
            </div>
        </section>
        
        <section class="right-side">
            <div class="formulário">
                <h2>Marque um horário agora mesmo!</h2>
                
                <label>Selecione o serviço desejado</label>
                <select class="input-box" name="Serviço" id="Seletor de Serviço">
                    <option value="Corte">Corte</option>
                    <option value="Pézinho">Pézinho</option>
                    <option value="Barba">Barba</option>
                    <option value="Corte e Barba">Corte e Barba</option>
                </select>
                
                <details class="agenda-selector" id="agenda-panel">
                    <summary class="agenda-summary">
                        <span>Escolher data e horário</span>
                        <span class="agenda-summary-value" id="agenda-summary-value">Hoje</span>
                    </summary>
                    <div class="agenda-expanded">
                        <div class="agenda-date-controls">
                            <button class="agenda-nav" id="agenda-prev" type="button" aria-label="Dia anterior">
                                <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="m15 18-6-6 6-6"></path>
                                </svg>
                            </button>
                            <label for="agenda-date">Escolha a data</label>
                            <input class="input-box" id="agenda-date" type="date">
                            <button class="agenda-nav" id="agenda-next" type="button" aria-label="Próximo dia">
                                <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="m9 18 6-6-6-6"></path>
                                </svg>
                            </button>
                        </div>
                        <div class="agenda-days" aria-label="Horários próximos">
                            <section class="agenda-day" id="agenda-previous-day">
                                <button class="agenda-day-header" id="agenda-previous-header" type="button"></button>
                                <div class="time-slots" id="agenda-previous-slots"></div>
                            </section>
                            <section class="agenda-day agenda-day-current" id="agenda-current-day">
                                <div class="agenda-day-header" id="agenda-current-header"></div>
                                <div class="time-slots" id="agenda-current-slots"></div>
                            </section>
                            <section class="agenda-day" id="agenda-next-day">
                                <button class="agenda-day-header" id="agenda-next-header" type="button"></button>
                                <div class="time-slots" id="agenda-next-slots"></div>
                            </section>
                        </div>
                        <p class="agenda-legend"><span class="agenda-legend-marker" aria-hidden="true"></span> Em vermelho: horário reservado</p>
                    </div>
                </details>

                <p class="agenda-feedback" id="agenda-feedback" role="status" aria-live="polite"></p>
                <button class="agenda-retry" id="retry-agenda" type="button" hidden>Recarregar horários</button>
                <button id="book-appointment" type="button">AGENDAR</button>
            </div>
        </section>
        
        <dialog class="formulário" id="login-dialog" aria-labelledby="login-title">
            <h2 id="login-title">Entrar</h2>
            <form class="login-form" id="login-form" method="dialog">
                <label for="login-email">E-mail</label>
                <input class="input-box" id="login-email" name="email" type="email" autocomplete="username" required>
                <label for="login-password">Senha</label>
                <input class="input-box" id="login-password" name="password" type="password" autocomplete="current-password" required>
                <p class="login-feedback" id="login-feedback" role="status" aria-live="polite"></p>
                <button id="login-submit" type="submit">Entrar</button>
            </form>
        </dialog>
    </main>
    
    <script src="scripts/showLoginCard.js"></script>
    <script type="module" src="scripts/login.js"></script>
    <script type="module" src="scripts/agenda.js"></script>
</body>
</html>
